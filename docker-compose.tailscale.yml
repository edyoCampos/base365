# Tailscale overlay — rebuilds with tsnet support for secure remote access.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.tailscale.yml up
#
# Required:
#   BASE365_TSNET_AUTH_KEY — Tailscale auth key (from https://login.tailscale.com/admin/settings/keys)
#
# Optional:
#   BASE365_TSNET_HOSTNAME — Tailscale device name (default: base365-gateway)

services:
  base365:
    build:
      args:
        ENABLE_TSNET: "true"
    environment:
      - BASE365_TSNET_HOSTNAME=${BASE365_TSNET_HOSTNAME:-base365-gateway}
      - BASE365_TSNET_AUTH_KEY=${BASE365_TSNET_AUTH_KEY}
    volumes:
      - tsnet-state:/app/tsnet-state

volumes:
  tsnet-state:
