# Upgrade overlay — one-shot database upgrade service.
#
# Usage:
#   # Preview changes (dry-run):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade --dry-run
#
#   # Apply upgrade:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade
#
#   # Check status:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade --status
#
# The upgrade service runs base365 upgrade and exits. Use --rm to auto-remove the container.

services:
  upgrade:
    image: ghcr.io/edyocampos/base365:latest
    build:
      context: ${BASE365_DIR:-.}
      dockerfile: Dockerfile
      args:
        ENABLE_OTEL: "false"
    env_file:
      - path: .env
        required: false
    environment:
      - BASE365_POSTGRES_DSN=postgres://${POSTGRES_USER:-base365}:${POSTGRES_PASSWORD:-base365}@postgres:5432/${POSTGRES_DB:-base365}?sslmode=disable
      - BASE365_CONFIG=/app/data/config.json
      - BASE365_MIGRATIONS_DIR=/app/migrations
      - BASE365_ENCRYPTION_KEY=${BASE365_ENCRYPTION_KEY:-}
    volumes:
      - base365-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/base365"]
    command: ["upgrade"]
    restart: "no"
