<noscript><div class="topic"><h1>Biblioteca solar em Pedra Azul</h1><div class="post"><p class="author">user0</p><p>A cidade de Pedra Azul inaugurou nesta semana a primeira biblioteca comunitária movida a energia solar da região serrana, depois de dois anos de obras financiadas por moradores e pequenos comerciantes locais.</p></div><div class="post"><p class="author">user1</p><p>O prédio ocupa um antigo armazém ferroviário e reúne mais de doze mil livros doados, salas de estudo silenciosas, um laboratório de informática e um espaço infantil com sessões semanais de contação de histórias.</p></div><div class="post"><p class="author">user2</p><p>Segundo a coordenadora do projeto, Marina Duarte, a ideia surgiu quando estudantes do ensino médio passaram a percorrer quarenta quilômetros até a cidade vizinha para conseguir acesso à internet e a livros didáticos atualizados.</p></div><div class="post"><p class="author">user3</p><p>As placas instaladas no telhado geram energia suficiente para manter a iluminação, os computadores e a climatização durante todo o horário de funcionamento, e o excedente é devolvido à rede elétrica municipal.</p></div><div class="post"><p class="author">user4</p><p>A prefeitura informou que pretende replicar o modelo em outros dois distritos rurais até o fim do próximo ano, usando o mesmo sistema de financiamento coletivo e a participação direta das associações de moradores.</p></div></div></noscript>
